team:[['Avery Mitchell','AM','Chief Executive Pilot','Leading our virtual airline with a focus on realism, safety, and community.'],['Jordan Williams','JW','Training Director','Designing approachable training from first flight to final approach.'],['Casey Nguyen','CN','Operations Director','Building a route network that makes every sector worth flying.']]};
const mem={};const store={get(k,f){try{let v=localStorage.getItem(k);return v?JSON.parse(v):(k in mem?mem[k]:f)}catch(e){return k in mem?mem[k]:f}},set(k,v){mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const $=s=>document.querySelector(s), app=$('#app'), modal=$('#modal'), body=$('#modal-body');let timer;
const safe=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const date=v=>new Date(v+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',day:'numeric',month:'short'});const flash=m=>{$('#toast-text').textContent=m;$('#toast').classList.add('show');clearTimeout(timer);timer=setTimeout(()=>$('#toast').classList.remove('show'),3300)};const open=(t,h)=>{$('#modal-title').textContent=t;body.innerHTML=h;modal.classList.add('open');document.body.style.overflow='hidden'};const close=()=>{modal.classList.remove('open');document.body.style.overflow=''};const ph=(e,t,p)=>`<section class="head"><div class="wrap"><span class="eyebrow light">${e}</span><h1>${t}</h1><p>${p}</p></div></section>`;
function live(f){return`<article class="card live"><div class="live-head"><div><h3>${f[0]}</h3><p>${f[1]} · ${f[7]}</p></div><div class="live-state">● En route</div></div><div class="live-body"><div class="live-route"><div class="airport">${f[2]}<small>${f[3]}</small></div><div><div class="progress"><span style="width:${f[6]}%"></span><i>✈</i></div><div class="progress-note">${f[6]}% complete</div></div><div class="airport">${f[4]}<small>${f[5]}</small></div></div><div class="live-stats"><div class="live-stat"><span>Altitude</span><b>${f[8]}</b></div><div class="live-stat"><span>Speed</span><b>${f[9]}</b></div><div class="live-stat"><span>ETA</span><b>${f[10]}</b></div><div class="live-stat"><span>Network</span><b>VATSIM</b></div></div></div></article>`}
function home(){return`<section class="hero"><img class="hero-image" src="${images.hero}" alt="Passenger aircraft above the clouds" fetchpriority="high" onerror="this.remove()"><div class="wrap hero-copy"><span class="eyebrow light">VATSIM virtual airline</span><h1>The spirit of <span>Australia.</span></h1><p>Fly the Flying Kangaroo across the globe. A welcoming home for pilots who care about the details, the routes, and the people at the other end of the flight.</p><div class="hero-buttons"><button class="btn primary" data-route="routes">Explore our routes →</button><button class="btn outline" data-route="crew">Meet the crew</button></div></div><div class="plane">✈</div></section><section class="stats"><div class="wrap"><div class="stat"><b>94</b><span>Global routes</span></div><div class="stat"><b>1,280+</b><span>Community flights</span></div><div class="stat"><b>48</b><span>Active pilots</span></div><div class="stat"><b>5★</b><span>Pilot experience</span></div></div></section><section class="section"><div class="wrap grid2 about"><div><span class="eyebrow">Who we are</span><h2>Professional flying.<br>Genuine community.</h2><p>Qantas Virtual recreates the experience of flying one of the world's most recognisable airlines on the VATSIM network. We combine operational realism with a community that makes every flight feel like it matters.</p><p>Whether you are logging your first hours or looking for a new long-haul home, there is a place for you in our flight deck.</p><button class="btn outline" data-route="team">Learn about our team</button></div><div class="about-art"><img src="${images.about}" alt="Airplane wing above the clouds" loading="lazy" onerror="this.remove()"><div class="stamp">FLY<br>WITH<br>PURPOSE</div></div></div></section><section class="section muted-section"><div class="wrap"><div class="center"><span class="eyebrow">The Qantas difference</span><h2>More than a callsign.</h2><p class="lead">A considered virtual airline experience, from your first briefing to your final shutdown.</p></div><div class="features"><article class="feature"><div class="feature-icon">◈</div><h3>Authentic operations</h3><p>Real-world inspired routes, aircraft, procedures, and flight standards designed for an immersive experience.</p></article><article class="feature"><div class="feature-icon">✦</div><h3>People first</h3><p>Friendly pilots, structured training, and regular events create a community you will want to return to.</p></article><article class="feature"><div class="feature-icon">⌁</div><h3>Always exploring</h3><p>From domestic hops to iconic ultra-long-haul sectors, there is always another horizon to discover.</p></article></div></div></section><section class="section dark-section"><div class="wrap network"><div><span class="eyebrow light">Explore the network</span><h2>Australia is only the beginning.</h2><p class="lead">Our route map connects the cities that define Qantas with the places every simmer wants to visit.</p><ul class="ticks"><li>Global long-haul and regional routes</li><li>Scheduled community flights</li><li>Aircraft matched to the route</li></ul><button class="btn outline" data-route="routes">View all routes</button></div><div class="map"><div class="line l1"></div><div class="line l2"></div><div class="line l3"></div><i class="dot hub d1"></i><b class="label" style="left:28%;top:52%">SYD</b><i class="dot d2"></i><b class="label" style="left:73%;top:35%">LHR</b><i class="dot d3"></i><b class="label" style="left:14%;top:35%">LAX</b><i class="dot d4"></i><b class="label" style="left:60%;top:40%">DXB</b><i class="dot d5"></i><b class="label" style="left:84%;top:47%">NRT</b></div></div></section><section class="section"><div class="wrap"><div class="toolbar"><div><span class="eyebrow">Right now</span><h2>Flights in the sky.</h2><p class="lead">Follow our local live board and see where the fleet is headed.</p></div><button class="btn outline" data-route="live">Open live board</button></div>${live(d.flights[0])}</div></section>`}
function routes(){return`<div class="page">${ph('Our network','Routes worth flying.','Find your next sector, choose your aircraft, and make the world a little smaller.')}<section class="section"><div class="wrap"><div class="toolbar"><b id="count">${d.routes.length} routes</b><div class="search"><input class="field" id="find" placeholder="Search airport or city"><select class="select" id="air"><option value="all">All aircraft</option><option>A380</option><option>787-9</option><option>A330</option></select></div></div><div class="cards2" id="route-list">${d.routes.map(r=>`<article class="card route" data-text="${safe((r.f+' '+r.o+' '+r.on+' '+r.x+' '+r.xn+' '+r.a).toLowerCase())}" data-air="${r.a}"><div class="route-top"><div><div class="route-code">${r.o}<i>→</i>${r.x}</div><div class="route-name">${r.on} to ${r.xn}</div></div><span class="pill">${r.tag}</span></div><div class="meta"><span>Aircraft <b>${r.a}</b></span><span>Distance <b>${r.km}</b></span><span>Time <b>${r.t}</b></span></div><div class="route-foot"><div class="schedule"><b>${r.f}</b>${r.s}</div><button class="btn primary small" data-book="${r.id}">Request a seat</button></div></article>`).join('')}</div></div></section></div>`}
function fleet(){return`<div class="page">${ph('Our fleet','Meet the fleet.','Three aircraft families, one unmistakable red tail. Choose your favourite machine and take to the skies.')}<section class="section"><div class="wrap cards3 fleet-grid">${d.fleet.map(a=>`<article class="card fleet"><div class="fleet-art ${a[2]}"><img src="${images[a[1]]}" alt="${a[0]} aircraft" loading="lazy" onerror="this.remove()"></div><div class="fleet-copy"><span class="pill">${a[1]}</span><h3>${a[0]}</h3><p>${a[3]}</p><div class="specs"><div class="spec"><b>${a[4]}</b><span>Range</span></div><div class="spec"><b>${a[5]}</b><span>Cruise</span></div><div class="spec"><b>${a[6]}</b><span>Capacity</span></div></div></div></article>`).join('')}</div></section></div>`}
function events(){let ss=store.get('qv-signups',[]);return`<div class="page">${ph('Virtual events','Meet us in the sky.','Group flights, challenges, and community moments built around the routes we love.')}<section class="section"><div class="wrap cards2 events">${d.events.map(e=>`<article class="card event"><div class="event-banner"><span class="pill" style="background:#fff2;color:#fff">${e[2]}</span><h3>${e[1]}</h3></div><div class="event-body"><p>${e[7]}</p><div class="details"><span>◷ <b>${date(e[3])}</b></span><span>◉ <b>${e[4]}</b></span><span>✈ <b>${e[5]}</b></span></div><div class="event-foot"><small style="color:var(--muted)">${ss.filter(x=>x.event===e[0]).length} signed up · ${e[6]} places</small><button class="btn primary small" data-event="${e[0]}">Sign up</button></div></div></article>`).join('')}</div></div></section></div>`}
function livePage(){return`<div class="page">${ph('Live operations','Where are we flying?','A local demonstration board for the Qantas Virtual network. No feeds, logins, or external services required.')}<section class="section"><div class="wrap"><div class="notice">This standalone edition ships with demo flights. Edit the data near the bottom of this HTML file to change them.</div><div class="live-list">${d.flights.map(live).join('')}</div></div></section></div>`}
function people(type){let arr=d[type];return`<div class="page">${ph(type==='crew'?'Our pilots':'Our people',type==='crew'?'Meet the crew.':'The team behind the tail.',type==='crew'?'The certified pilots and friendly faces who keep the network moving.':'A small group of aviation enthusiasts building a virtual airline where every pilot can belong.')}<section class="section"><div class="wrap cards3">${arr.map(p=>`<article class="card people"><div class="avatar">${p[1]}</div><h3>${p[0]}</h3><p>${p[2]}</p><small>${type==='crew'?p[3]+' completed flights<br>':''}${p[4]||p[3]}</small></article>`).join('')}</div></div></section>${type==='team'?`<section class="section muted-section"><div class="center"><span class="eyebrow">Come fly with us</span><h2>Your seat is waiting.</h2><p class="lead">Explore the local pilot hub and start building your own flight history.</p><button class="btn primary" data-route="pilot">Open pilot hub</button></div></section>`:''}</div>`}
function pilot(){let bs=store.get('qv-bookings',[]);return`<div class="page">${ph('Pilot hub','Your flight deck.','A lightweight local pilot space for exploring routes and keeping track of requests in this browser.')}<section class="section"><div class="wrap pilot-panel"><article class="card pilot-card"><span class="eyebrow">Local flight desk</span><h2>Ready for departure?</h2><p>Browse the network, request a seat, and keep your local booking list close at hand. Everything stays in this browser.</p><ul class="ticks"><li>Request seats on scheduled routes</li><li>Review and cancel local requests</li><li>Save event registrations on this device</li><li>Works from a downloaded HTML file</li></ul><button class="btn primary" data-route="routes">Browse routes</button></article><aside class="local"><span class="eyebrow light">Browser storage</span><h3>${bs.length} local booking${bs.length===1?'':'s'}</h3><p>Requests are stored locally when your browser allows it. They are not sent to a server or emailed anywhere.</p>${bs.length?bs.slice(-3).reverse().map(b=>`<div style="border-top:1px solid #fff2;padding-top:9px;margin-top:9px;font-size:12px"><b>${b.f}</b> · ${b.o} → ${b.x}<br><span style="color:#fff8">${safe(b.name)}</span><button class="btn outline small" style="float:right;min-height:25px" data-cancel="${b.id}">Cancel</button></div>`).join(''):'<p style="color:#fff8">Your requests will appear here.</p>'}</aside></div></section></div>`}
const pages={home,routes,fleet,events,live:livePage,crew:()=>people('crew'),team:()=>people('team'),pilot};function render(){let key=(location.hash.slice(1)||'home').split('?')[0];if(!pages[key])key='home';app.innerHTML=pages[key]();document.querySelectorAll('[data-route]').forEach(x=>x.classList.toggle('active',x.dataset.route===key));document.title=key==='home'?'Qantas Virtual — The Spirit of Australia':key[0].toUpperCase()+key.slice(1)+' — Qantas Virtual';window.scrollTo(0,0);if(key==='routes')filters()}
function filters(){let f=$('#find'),a=$('#air');function update(){let q=f.value.toLowerCase(),ac=a.value,n=0;document.querySelectorAll('[data-text]').forEach(x=>{let yes=(!q||x.dataset.text.includes(q))&&(ac==='all'||x.dataset.air===ac);x.style.display=yes?'':'none';if(yes)n++});$('#count').textContent=n+' route'+(n===1?'':'s')}f.oninput=update;a.onchange=update}
function booking(id){let r=d.routes.find(x=>x.id===id);open('Request '+r.f,`<p class="modal-intro"><b>${r.o} → ${r.x}</b> · ${r.on} to ${r.xn}<br>${r.a} · ${r.s}</p><form class="form" id="booking-form"><label>Your name<input class="field" name="name" required placeholder="Alex Smith"></label><label>Email for your own reference<input class="field" type="email" name="email" required placeholder="alex@example.com"></label><label>Preferred date<input class="field" type="date" name="date" required></label><label>Notes<textarea class="textarea" name="note" placeholder="Anything the flight desk should know?"></textarea></label><div class="notice" style="margin:0">This is a local request only. No data leaves this device.</div><div class="form-actions"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn primary">Save request</button></div></form>`);$('#booking-form').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),bs=store.get('qv-bookings',[]);bs.push({id:'b'+Date.now(),f:r.f,o:r.o,x:r.x,name:f.get('name'),email:f.get('email'),date:f.get('date')});store.set('qv-bookings',bs);close();flash('Saved your '+r.f+' request locally.')}}
function eventSignup(id){let e=d.events.find(x=>x[0]===id);open('Join this event',`<p class="modal-intro"><b>${e[1]}</b><br>${date(e[3])} · ${e[4]} · ${e[5]}</p><form class="form" id="event-form"><label>Your name<input class="field" name="name" required placeholder="Alex Smith"></label><label>Email<input class="field" type="email" name="email" required placeholder="alex@example.com"></label><label>Joining as<select class="select" name="role"><option>Pilot</option><option>Passenger</option><option>Observer</option></select></label><div class="form-actions"><button class="btn ghost" type="button" data-close>Cancel</button><button class="btn primary">Save registration</button></div></form>`);$('#event-form').onsubmit=x=>{x.preventDefault();let f=new FormData(x.target),s=store.get('qv-signups',[]);s.push({event:id,name:f.get('name'),email:f.get('email'),role:f.get('role')});store.set('qv-signups',s);close();flash('You are registered for '+e[1]+'.');render()}}
document.addEventListener('click',e=>{let r=e.target.closest('[data-route]');if(r){e.preventDefault();if(location.hash.slice(1)===r.dataset.route)render();else location.hash=r.dataset.route;$('#mobile').classList.remove('open');return}let b=e.target.closest('[data-book]');if(b){booking(b.dataset.book);return}let ev=e.target.closest('[data-event]');if(ev){eventSignup(ev.dataset.event);return}let c=e.target.closest('[data-cancel]');if(c){store.set('qv-bookings',store.get('qv-bookings',[]).filter(x=>x.id!==c.dataset.cancel));flash('Local booking cancelled.');render();return}if(e.target.closest('[data-close]'))close()});$('#close').onclick=close;modal.onclick=e=>{if(e.target===modal)close()};document.onkeydown=e=>{if(e.key==='Escape')close()};window.onhashchange=render;$('#menu').onclick=()=>{let open=$('#mobile').classList.toggle('open');$('#menu').setAttribute('aria-expanded',String(open))};let theme=store.get('qv-theme','light');if(theme==='dark')document.documentElement.dataset.theme='dark';$('#theme').textContent=theme==='dark'?'☀':'☾';$('#theme').onclick=()=>{let dark=document.documentElement.dataset.theme==='dark';if(dark)delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme='dark';store.set('qv-theme',dark?'light':'dark');$('#theme').textContent=dark?'☾':'☀'};$('#year').textContent=new Date().getFullYear();render();
}());
</script>
